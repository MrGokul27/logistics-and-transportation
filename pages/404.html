<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Stackly Transportation and Logistics</title>

    <!-- Google Fonts: Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font Awesome 6.7.2 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/404.css" />
  </head>
  <body>
    <!-- Common Header Component Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Page Main Content -->
    <main>
      <!-- 404 Hero Section -->
      <section class="error-404-section">
        <!-- Right Side Full-Bleed Fleet Image with Smooth Fade into Content -->
        <div class="error-404-bg-visual" aria-hidden="true">
          <div class="error-404-fade-overlay"></div>
          <img
            src="../assets/images/404-image.webp"
            alt="404 Page Not Found - AX Transport & Logistics"
            class="error-404-bg-img"
          />
        </div>

        <div class="container">
          <div class="row align-items-center">
            <!-- Left Text Content (Standard Container Alignment) -->
            <div class="col-12 col-lg-6 col-xl-5">
              <div class="error-404-content">
                <div class="error-404-code error-404-fade-in">404</div>
                <h1 class="error-404-title error-404-fade-in delay-1">
                  Oops! This Page<br />is Too Spicy...
                </h1>
                <p class="error-404-description error-404-fade-in delay-2">
                  The page you’re looking for doesn’t exist or has been moved.
                  Let’s get you back on track!
                </p>
                <div class="error-404-actions error-404-fade-in delay-3">
                  <a href="../index.html" class="btn-404-home">
                    <span>Back to Home</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                  </a>
                  <button
                    type="button"
                    class="btn-404-back"
                    onclick="
                      if (window.history.length > 1) {
                        window.history.back();
                      } else {
                        window.location.href = '../index.html';
                      }
                    "
                  >
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    <span>Go Back</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Common Footer Component Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Custom JavaScript -->
    <script src="../assets/js/script.js"></script>
  </body>
</html>
