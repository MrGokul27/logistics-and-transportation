<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Stackly Transportation and Logistics</title>

    <!-- Google Fonts: Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font Awesome 6.7.2 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <!-- Common Header Component Placeholder (Loaded from pages/components/header.html) -->
    <div id="header-placeholder"></div>

    <!-- Page Content -->
    <main>
      <section class="py-5 bg-light">
        <div class="container py-5 text-center">
          <h1 class="display-4 fw-bold mb-3">Contact Stackly Logistics</h1>
          <p class="lead text-muted mx-auto" style="max-width: 680px">
            Get in touch with our freight and fleet specialists. Request a quote, schedule a consultation, or ask any question.
          </p>
        </div>
      </section>

      <section class="py-5">
        <div class="container py-4">
          <div class="row g-5 justify-content-center">
            <div class="col-12 col-lg-7">
              <div class="card border-0 shadow-sm p-4 p-md-5 rounded-3">
                <h3 class="fw-bold mb-4">Request a Freight Quote</h3>
                <form>
                  <div class="row g-3">
                    <div class="col-12 col-sm-6">
                      <label class="form-label fw-semibold small">First Name</label>
                      <input type="text" class="form-control" placeholder="John" required />
                    </div>
                    <div class="col-12 col-sm-6">
                      <label class="form-label fw-semibold small">Last Name</label>
                      <input type="text" class="form-control" placeholder="Doe" required />
                    </div>
                    <div class="col-12">
                      <label class="form-label fw-semibold small">Email Address</label>
                      <input type="email" class="form-control" placeholder="john@example.com" required />
                    </div>
                    <div class="col-12">
                      <label class="form-label fw-semibold small">Freight Service Type</label>
                      <select class="form-select">
                        <option>Full Truckload (FTL)</option>
                        <option>Less Than Load (LTL)</option>
                        <option>Post & Courier Express</option>
                        <option>Commercial Fuel Delivery</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <label class="form-label fw-semibold small">Message / Freight Details</label>
                      <textarea class="form-control" rows="4" placeholder="Origin, destination, cargo weight, and specific requirements..."></textarea>
                    </div>
                    <div class="col-12 mt-4">
                      <button type="submit" class="btn btn-primary w-100 py-3">
                        <span>SUBMIT FREIGHT REQUEST</span>
                        <i class="fa-solid fa-chevron-right btn-arrow" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Custom JavaScript -->
    <script src="../assets/js/script.js"></script>
  </body>
</html>
