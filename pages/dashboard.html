<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Enterprise Logistics Dashboard | Stackly Transportation & Logistics
    </title>

    <!-- Google Fonts: Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font Awesome 6.7.2 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom Theme & Dashboard Stylesheet -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
  </head>
  <body class="dashboard-body">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-container">
      <!-- ==========================================================================
           Sidebar Navigation
           ========================================================================== -->
      <aside class="dashboard-sidebar" id="dashboardSidebar">
        <!-- Sidebar Brand Header -->
        <div class="sidebar-header">
          <a href="../index.html" class="sidebar-brand">
            <img
              src="../assets/images/logoStackly-footer.webp"
              alt="Stackly Logistics"
              class="sidebar-brand-logo"
            />
          </a>
          <button
            type="button"
            class="sidebar-close-btn"
            id="sidebarCloseBtn"
            aria-label="Close navigation"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Sidebar User Profile Card -->
        <div class="sidebar-user-card">
          <div class="sidebar-user-avatar" id="sidebarUserAvatar">GN</div>
          <div class="sidebar-user-details">
            <div class="sidebar-user-name" id="sidebarUserName">Gokul Nath</div>
            <div class="sidebar-user-role-badge" id="sidebarUserRole">
              <i class="fa-solid fa-user-shield me-1"></i> Administrator
            </div>
          </div>
        </div>

        <!-- Sidebar Navigation Items (Populated dynamically based on role) -->
        <nav class="sidebar-nav-container" aria-label="Dashboard Navigation">
          <div class="sidebar-nav-section-title">Navigation Menu</div>
          <ul class="sidebar-nav-list" id="sidebarNavList">
            <!-- Rendered by dashboard.js based on role -->
          </ul>
        </nav>

        <!-- Sidebar Footer Action -->
        <div class="sidebar-footer">
          <button type="button" class="btn-sidebar-logout" id="logoutBtn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Sign Out</span>
          </button>
        </div>
      </aside>

      <!-- ==========================================================================
           Main Dashboard Area
           ========================================================================== -->
      <main class="dashboard-main">
        <!-- Top App Navigation Bar -->
        <header class="dashboard-topbar">
          <div class="topbar-left">
            <button
              type="button"
              class="sidebar-toggle-btn d-lg-none"
              id="mobileSidebarToggle"
              aria-label="Toggle mobile menu"
            >
              <i class="fa-solid fa-bars"></i>
            </button>

            <div class="topbar-title-block">
              <h1 class="topbar-page-title" id="topbarPageTitle">Overview</h1>
              <div class="topbar-subtitle">
                <span class="topbar-status-dot"></span>
                <span>Stackly Cloud Telematics Mesh • 99.98% Live SLA</span>
              </div>
            </div>
          </div>

          <div class="topbar-right">
            <!-- Dynamic Role Switcher (Allows instant previewing of all 5 roles) -->
            <div class="role-switcher-box">
              <i class="fa-solid fa-id-badge text-primary"></i>
              <span class="role-switcher-label">Active Role:</span>
              <select
                class="role-select-dropdown"
                id="dashRoleSelect"
                aria-label="Switch dashboard role"
              >
                <option value="customer">Customer / Shipper</option>
                <option value="driver">Driver / Carrier</option>
                <option value="fleet_manager">Fleet Manager</option>
                <option value="logistics_coordinator">
                  Logistics Coordinator
                </option>
                <option value="admin">Administrator</option>
              </select>
            </div>

            <!-- Global Action Button -->
            <button
              type="button"
              class="btn-topbar-action d-none d-sm-inline-flex"
            >
              <i class="fa-solid fa-plus"></i>
              <span>New Dispatch</span>
            </button>

            <!-- Notifications Toggle -->
            <button type="button" class="topbar-icon-btn" title="Notifications">
              <i class="fa-regular fa-bell"></i>
              <span class="topbar-badge-count">3</span>
            </button>

            <!-- User Menu -->
            <div class="topbar-user-menu">
              <div class="topbar-user-avatar" id="topbarUserAvatar">
                <i class="fa-solid fa-user-shield"></i>
              </div>
              <div class="topbar-user-info d-none d-md-flex">
                <span class="topbar-user-name" id="topbarUserName"
                  >Gokul Nath</span
                >
                <span class="topbar-user-role" id="topbarUserRole"
                  >Administrator</span
                >
              </div>
            </div>
          </div>
        </header>

        <!-- Main Dynamic View Container -->
        <div class="dashboard-content-area" id="dashboardViewContainer">
          <!-- Populated by dashboard.js according to active view -->
        </div>
      </main>
    </div>

    <!-- Bootstrap 5.3.3 JS Bundle CDN -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Dashboard App Logic -->
    <script src="../assets/js/dashboard.js"></script>
  </body>
</html>
